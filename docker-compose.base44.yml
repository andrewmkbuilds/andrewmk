services:
  web:
    image: oven/bun:1-debian
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=development
    command: sh -c "bun install && bun scripts/generate-sitemap.ts && bun scripts/generate-og-images.ts && bunx vite dev"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
