# Supabase-compatible API gateway for the Base44 sandbox.
#
# The browser and the SSR server both talk to this origin as SUPABASE_URL:
#   /rest/v1/*  -> PostgREST
#   /auth/v1/*  -> GoTrue
# CORS headers are set here (and upstream copies hidden) so the preview origin
# on port 3000 can call the API on port 8000.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  access_log off;
  client_max_body_size 20m;

  server {
    listen 8000;
    server_name _;

    # Resolve the API containers through Docker's DNS on every request so a
    # restarted container's new IP is picked up without restarting the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, accept, x-client-info, x-supabase-api-version, prefer, range, accept-profile, content-profile" always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Location, Location, Range, Preference-Applied" always;
    add_header Access-Control-Max-Age "3600" always;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location = /health {
      add_header Access-Control-Allow-Origin "*" always;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /rest/v1/ {
      set $rest_upstream "http://rest:3000";
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass $rest_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/v1/ {
      set $auth_upstream "http://auth:9999";
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass $auth_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
