    <rect x="700" y="266" width="291" height="8" rx="4" fill="#3d9fe0"/>

    <text x="700" y="318">KEYWORD COVERAGE</text>
    <rect x="700" y="332" width="360" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="700" y="332" width="324" height="8" rx="4" fill="#7cc7f0"/>

    <text x="700" y="384">QUANTIFIED RESULTS</text>
    <rect x="700" y="398" width="360" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="700" y="398" width="234" height="8" rx="4" fill="#d9b268"/>
  </g>

  <g>
    <rect x="700" y="452" width="370" height="112" rx="10" fill="#0b1d30" stroke="#ffffff" stroke-opacity="0.09"/>
