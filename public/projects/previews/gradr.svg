    <rect x="720" y="496" width="290" height="8" rx="4" fill="#5d6f82"/>
    <rect x="720" y="514" width="256" height="8" rx="4" fill="#d9b268" opacity="0.85"/>
    <rect x="720" y="532" width="180" height="8" rx="4" fill="#3d9fe0" opacity="0.8"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2">
