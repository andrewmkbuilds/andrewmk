    <text x="756" y="614" text-anchor="middle" fill="#e8c98f">INTERVIEW</text>
    <rect x="824" y="592" width="112" height="34" rx="17" fill="#3d9fe0" fill-opacity="0.12" stroke="#3d9fe0" stroke-opacity="0.4"/>
    <text x="880" y="614" text-anchor="middle" fill="#9ed4f4">TRACKING</text>
    <rect x="948" y="592" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="1009" y="614" text-anchor="middle" fill="#aebccb">ANALYTICS</text>
  </g>

  <text x="700" y="716" fill="#f2f6fb" fill-opacity="0.15" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="4">CAREER ACCELERATOR</text>
  <text x="700" y="768" fill="#f4f8fc" font-family="Georgia, 'Times New Roman', serif" font-size="74" font-style="italic">Gradr<tspan fill="#d9b268">.</tspan></text>
