<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060e1a"/>
      <stop offset="0.58" stop-color="#0a1a2c"/>
      <stop offset="1" stop-color="#0f2a41"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.16" cy="0.04" r="0.8">
      <stop offset="0" stop-color="#3d9fe0" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3d9fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldbloom" cx="0.98" cy="0.96" r="0.62">
      <stop offset="0" stop-color="#d9b268" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d9b268" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f8fbfe"/>
      <stop offset="0.62" stop-color="#e4ecf5"/>
      <stop offset="1" stop-color="#cfdcea"/>
    </linearGradient>
    <linearGradient id="ringgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e0b2"/>
      <stop offset="0.55" stop-color="#d9b268"/>
      <stop offset="1" stop-color="#b78c46"/>
    </linearGradient>
    <filter id="paperShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#02070e" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#bloom)"/>
  <rect width="1200" height="800" fill="url(#goldbloom)"/>

  <line x1="600" y1="96" x2="600" y2="664" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <line x1="1120" y1="96" x2="1120" y2="664" stroke="#d9b268" stroke-opacity="0.35" stroke-width="1.5"/>

  <g transform="rotate(-4 326 398)" filter="url(#paperShadow)">
    <rect x="96" y="118" width="460" height="560" rx="12" fill="url(#paper)"/>
    <rect x="96" y="118" width="460" height="12" rx="6" fill="#d9b268" opacity="0.85"/>
    <rect x="140" y="176" width="66" height="6" rx="3" fill="#b78c46"/>
    <rect x="140" y="204" width="252" height="20" rx="6" fill="#102a41"/>
    <rect x="140" y="238" width="150" height="10" rx="5" fill="#7d93a8"/>

    <line x1="140" y1="280" x2="472" y2="280" stroke="#b9cadb" stroke-width="1.4"/>
    <rect x="140" y="300" width="332" height="9" rx="4.5" fill="#9fb2c4"/>
    <rect x="140" y="322" width="300" height="9" rx="4.5" fill="#9fb2c4"/>
    <rect x="140" y="344" width="248" height="9" rx="4.5" fill="#a9bccd"/>

    <rect x="140" y="386" width="84" height="7" rx="3.5" fill="#b78c46"/>
    <rect x="140" y="410" width="316" height="9" rx="4.5" fill="#9fb2c4"/>
    <rect x="140" y="432" width="272" height="9" rx="4.5" fill="#9fb2c4"/>
    <rect x="140" y="454" width="298" height="9" rx="4.5" fill="#a9bccd"/>

    <rect x="140" y="496" width="84" height="7" rx="3.5" fill="#b78c46"/>
    <rect x="140" y="520" width="228" height="9" rx="4.5" fill="#9fb2c4"/>
    <rect x="140" y="542" width="286" height="9" rx="4.5" fill="#9fb2c4"/>

    <circle cx="472" cy="414" r="9" fill="#d9b268" opacity="0.55"/>
    <circle cx="472" cy="458" r="9" fill="#d9b268" opacity="0.35"/>
    <circle cx="472" cy="524" r="9" fill="#d9b268" opacity="0.7"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="622" cy="206" r="74" fill="#081625" fill-opacity="0.94" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <circle cx="622" cy="206" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12"/>
    <circle cx="622" cy="206" r="58" fill="none" stroke="url(#ringgold)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="317 365" transform="rotate(-90 622 206)"/>
    <text x="622" y="218" text-anchor="middle" fill="#f4ead6" font-family="Georgia, 'Times New Roman', serif" font-size="44">87</text>
  </g>
  <text x="622" y="308" text-anchor="middle" fill="#d9b268" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="5">ATS</text>

  <text x="700" y="196" fill="#d9b268" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="4">RESUME MATCH</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#c3d1de">
