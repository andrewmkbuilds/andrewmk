<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050c18"/>
      <stop offset="0.5" stop-color="#081827"/>
      <stop offset="1" stop-color="#0c2334"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.18" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#3d9fe0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3d9fe0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.9" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#d9b268" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d9b268" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#blue)"/>
  <rect width="1200" height="800" fill="url(#gold)"/>

  <text x="76" y="84" fill="#8fb6d6" font-family="ui-monospace, Menlo, monospace" font-size="15" letter-spacing="4">AI · GAME · DECISION ENGINE</text>

  <!-- board -->
  <g>
    <rect x="92" y="132" width="440" height="440" rx="10" fill="#0a1a29" stroke="#d9b268" stroke-opacity="0.3" stroke-width="2"/>
    <g stroke="#d9b268" stroke-opacity="0.35" stroke-width="2">
      <line x1="238.6" y1="132" x2="238.6" y2="572"/>
      <line x1="385.3" y1="132" x2="385.3" y2="572"/>
      <line x1="92" y1="278.6" x2="532" y2="278.6"/>
      <line x1="92" y1="425.3" x2="532" y2="425.3"/>
    </g>

    <!-- X and O -->
    <g stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M132 176l56 56M188 176l-56 56" stroke="#7cc7f0"/>
      <circle cx="312" cy="204" r="34" stroke="#f0d29a"/>
      <path d="M424 176l56 56M480 176l-56 56" stroke="#7cc7f0"/>
      <circle cx="165" cy="352" r="34" stroke="#f0d29a"/>
      <path d="M278 302l56 56M334 302l-56 56" stroke="#7cc7f0"/>
      <circle cx="458" cy="352" r="34" stroke="#f0d29a"/>
    </g>

    <!-- candidate cell -->
    <rect x="385.3" y="425.3" width="146.7" height="146.7" fill="#d9b268" fill-opacity="0.12"/>
    <rect x="389" y="429" width="139" height="139" fill="none" stroke="#d9b268" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="458" y="500" text-anchor="middle" fill="#f0d29a" font-family="Georgia, 'Times New Roman', serif" font-size="30">?</text>
    <text x="458" y="528" text-anchor="middle" fill="#e8c98f" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="1">+0.94</text>
  </g>

  <!-- evaluation -->
  <g>
    <text x="580" y="164" fill="#7b93a8" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3">BOARD EVALUATED · 7 PLIES</text>
    <rect x="580" y="184" width="544" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="580" y="184" width="500" height="10" rx="5" fill="#d9b268"/>
    <text x="580" y="216" fill="#e8c98f" font-family="ui-monospace, Menlo, monospace" font-size="13" letter-spacing="2">WIN PROBABILITY 92%</text>

    <!-- candidate branches -->
    <g>
      <path d="M580 262 H 664" stroke="#7cc7f0" stroke-opacity="0.4" stroke-width="2"/>
      <path d="M580 262 C 600 262, 610 320, 664 320" stroke="#7cc7f0" stroke-opacity="0.4" stroke-width="2"/>
      <path d="M580 262 C 600 262, 610 378, 664 378" stroke="#7cc7f0" stroke-opacity="0.25" stroke-width="2"/>

      <!-- mini boards -->
      <g>
        <rect x="664" y="234" width="60" height="60" rx="3" fill="#0b1c2b" stroke="#d9b268" stroke-opacity="0.55"/>
        <g stroke="#d9b268" stroke-opacity="0.4"><line x1="684" y1="234" x2="684" y2="294"/><line x1="704" y1="234" x2="704" y2="294"/><line x1="664" y1="254" x2="724" y2="254"/><line x1="664" y1="274" x2="724" y2="274"/></g>
        <path d="M686 252l6 6M692 252l-6 6" stroke="#7cc7f0" stroke-width="1.6"/>
        <text x="746" y="272" fill="#e8c98f" font-family="ui-monospace, Menlo, monospace" font-size="13">+0.94</text>

        <rect x="664" y="296" width="60" height="60" rx="3" fill="#0b1c2b" stroke="#ffffff" stroke-opacity="0.14"/>
        <g stroke="#ffffff" stroke-opacity="0.16"><line x1="684" y1="296" x2="684" y2="356"/><line x1="704" y1="296" x2="704" y2="356"/><line x1="664" y1="316" x2="724" y2="316"/><line x1="664" y1="336" x2="724" y2="336"/></g>
        <circle cx="674" cy="326" r="4" fill="none" stroke="#f0d29a" stroke-width="1.4"/>
        <text x="746" y="334" fill="#a9b8c6" font-family="ui-monospace, Menlo, monospace" font-size="13">+0.71</text>

        <rect x="664" y="358" width="60" height="60" rx="3" fill="#0b1c2b" stroke="#ffffff" stroke-opacity="0.1"/>
        <g stroke="#ffffff" stroke-opacity="0.12"><line x1="684" y1="358" x2="684" y2="418"/><line x1="704" y1="358" x2="704" y2="418"/><line x1="664" y1="378" x2="724" y2="378"/><line x1="664" y1="398" x2="724" y2="398"/></g>
        <text x="746" y="396" fill="#6f8395" font-family="ui-monospace, Menlo, monospace" font-size="13">+0.38</text>
      </g>
    </g>

    <!-- decision strip -->
    <g>
      <line x1="580" y1="454" x2="1124" y2="454" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="580" y="486" fill="#7b93a8" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3">MOVE SIMULATED</text>
      <text x="580" y="520" fill="#eef3f8" font-family="Georgia, 'Times New Roman', serif" font-size="30">Centre-right, column 3</text>
      <text x="580" y="552" fill="#6f8395" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="2">WINS NOW · BLOCKS THE FORK</text>
    </g>
  </g>

  <!-- identity -->
  <text x="92" y="676" fill="#f4f8fc" font-family="Georgia, 'Times New Roman', serif" font-size="60">NeuroTac <tspan fill="#d9b268" font-style="italic">AI</tspan></text>
  <text x="96" y="716" fill="#7b93a8" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3">DECISION-BASED TIC TAC TOE ENGINE</text>
  <text x="1124" y="716" text-anchor="end" fill="#5f7285" font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3">PYTHON · CUSTOM AI LOGIC</text>
</svg>
