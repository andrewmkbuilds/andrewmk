name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Build, SEO regression & accessibility
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Formatting
        run: bun run format:check

      - name: Validate portfolio data
        run: bun run validate:data

      - name: TypeScript
        run: bun run typecheck

      # Nitro's default target is the cloudflare-module Worker bundle that gets
      # deployed; `wrangler deploy --dry-run` validates that bundle end to end
      # (entry point, assets binding, compatibility flags) without credentials.
      # Run before the preview build below, which rewrites .output.
      - name: Build (Cloudflare Workers bundle)
        run: bun run build

      - name: Cloudflare deploy dry-run
        run: bun run deploy:check
        env:
          WRANGLER_SEND_METRICS: "false"

      # `vite preview` cannot serve a Nitro build (its TanStack preview plugin
      # imports dist/server/server.js), so the preview runs Nitro's own node
      # server entry, built into .output/server/index.mjs here.
      - name: Build (Nitro node server, for the preview stage)
        run: bun run build:preview

      - name: Start preview server
        run: |
          PORT=4173 bun run preview &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 2
          done
          # Fail this step loudly if the server never answered, instead of
          # letting every later check report a 500.
          curl -sf -o /dev/null http://localhost:4173/

      - name: SEO regression checks
        run: bun run seo:regression -- --base=http://localhost:4173

      - name: Accessibility checks
        run: bun run a11y:check -- --base=http://localhost:4173

      - name: Install Playwright browsers (selection visual checks)
        run: |
          python3 -m pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium firefox webkit

      - name: Text-selection visual regression
        run: python3 scripts/selection-visual-check.py http://localhost:4173

      - name: CTA hover / focus visual regression
        run: python3 scripts/cta-visual-check.py http://localhost:4173

      - name: Home card pop hover / focus regression
        run: python3 scripts/home-pop-check.py http://localhost:4173

      - name: Upload selection screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-visual
          path: artifacts/selection-visual
          if-no-files-found: ignore
