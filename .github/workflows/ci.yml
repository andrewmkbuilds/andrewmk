name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Build, SEO regression & accessibility
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Validate portfolio data
        run: bun run validate:data

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 4173 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 2
          done

      - name: SEO regression checks
        run: bun run seo:regression -- --base=http://localhost:4173

      - name: Accessibility checks
        run: bun run a11y:check -- --base=http://localhost:4173
